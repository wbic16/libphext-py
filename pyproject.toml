[project]
name = "libphext"
version = "0.3.0"
description = "Pythonic implementation of phext"
authors = [{ name = "Will Bickford <wbic16@gmail.com>" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[project.scripts]
phext = "libphext_py.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"